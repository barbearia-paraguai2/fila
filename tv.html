<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d2137 30%, #0f2a4a 60%, #0a1628 100%);
      color: #e8edf3;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }
    
    .header {
      padding: 14px 40px;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.95) 0%, rgba(10, 22, 40, 0.7) 100%);
      border-bottom: 3px solid rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: 80px;
    }
    
    .header h1 {
      font-size: 2.4em;
      font-weight: 900;
      background: linear-gradient(135deg, #D4AF37, #F5D060, #D4AF37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    
    .header .clock {
      font-size: 2.2em;
      color: #e2e8f0;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .header .date {
      font-size: 1.1em;
      color: #93c5fd;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .main-container {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    /* Grupo esquerdo (sem QR) e direito (com QR) */
    .group-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .group-section.has-qr {
      border-right: 3px solid rgba(59, 130, 246, 0.15);
    }

    .group-body {
      flex: 1;
      display: flex;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    .barber-column {
      flex: 1;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.6) 0%, rgba(10, 22, 40, 0.4) 100%);
      border-radius: 14px;
      border: 2px solid rgba(59, 130, 246, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    .barber-header {
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.4), rgba(37, 99, 235, 0.2));
      border-bottom: 2px solid rgba(59, 130, 246, 0.3);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .barber-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-shrink: 1;
    }
    
    .barber-name {
      font-size: 1.5em;
      font-weight: 900;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .barber-unit-badge {
      font-size: 0.65em;
      color: #64748b;
      font-weight: 700;
      background: rgba(100, 116, 139, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(100, 116, 139, 0.15);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .barber-count {
      font-size: 0.85em;
      color: #fbbf24;
      font-weight: 800;
      background: rgba(234, 179, 8, 0.15);
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .barber-status {
      font-size: 0.85em;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .barber-status.livre { 
      color: #4ade80; 
      background: rgba(74, 222, 128, 0.12);
      border: 2px solid rgba(74, 222, 128, 0.3);
    }
    .barber-status.ocupado { 
      color: #f97316; 
      background: rgba(249, 115, 22, 0.12);
      border: 2px solid rgba(249, 115, 22, 0.3);
    }
    
    .queue-list {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
    }

    .queue-list::-webkit-scrollbar { width: 6px; }
    .queue-list::-webkit-scrollbar-track { background: transparent; }
    .queue-list::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 4px; }
    
    .queue-item {
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .queue-item.size-xl { padding: 20px 18px; }
    .queue-item.size-xl .senha-badge { font-size: 1.8em; min-width: 75px; }
    .queue-item.size-xl .client-name { font-size: 1.5em; }
    .queue-item.size-xl .client-service { font-size: 1em; }
    .queue-item.size-xl .status-tag { font-size: 0.9em; padding: 6px 12px; }
    .queue-item.size-xl .wait-time { font-size: 0.9em; }

    .queue-item.size-lg { padding: 16px 16px; }
    .queue-item.size-lg .senha-badge { font-size: 1.4em; min-width: 65px; }
    .queue-item.size-lg .client-name { font-size: 1.2em; }
    .queue-item.size-lg .client-service { font-size: 0.9em; }
    .queue-item.size-lg .status-tag { font-size: 0.8em; padding: 4px 10px; }
    .queue-item.size-lg .wait-time { font-size: 0.82em; }

    .queue-item.size-md { padding: 12px 14px; }
    .queue-item.size-md .senha-badge { font-size: 1.15em; min-width: 55px; }
    .queue-item.size-md .client-name { font-size: 1em; }
    .queue-item.size-md .client-service { font-size: 0.82em; }
    .queue-item.size-md .status-tag { font-size: 0.7em; padding: 3px 8px; }
    .queue-item.size-md .wait-time { font-size: 0.75em; }

    .queue-item.size-sm { padding: 9px 12px; }
    .queue-item.size-sm .senha-badge { font-size: 0.95em; min-width: 46px; }
    .queue-item.size-sm .client-name { font-size: 0.9em; }
    .queue-item.size-sm .client-service { font-size: 0.75em; }
    .queue-item.size-sm .status-tag { font-size: 0.62em; padding: 3px 7px; }
    .queue-item.size-sm .wait-time { font-size: 0.7em; }

    .queue-item.size-xs { padding: 7px 10px; gap: 8px; }
    .queue-item.size-xs .senha-badge { font-size: 0.85em; min-width: 40px; }
    .queue-item.size-xs .client-name { font-size: 0.8em; }
    .queue-item.size-xs .client-service { display: none; }
    .queue-item.size-xs .status-tag { font-size: 0.55em; padding: 2px 6px; }
    .queue-item.size-xs .wait-time { font-size: 0.62em; }
    
    .queue-item.na-fila {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(234, 179, 8, 0.05));
      border: 2px solid rgba(234, 179, 8, 0.3);
    }
    
    .queue-item.chamado {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.25), rgba(249, 115, 22, 0.1));
      border: 2px solid rgba(249, 115, 22, 0.5);
      animation: slideIn 0.4s ease-out, chamadoPulse 1.5s ease-in-out infinite;
    }

    @keyframes chamadoPulse {
      0%, 100% { 
        opacity: 1; 
        box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
        border-color: rgba(249, 115, 22, 0.5);
      }
      50% { 
        opacity: 0.9; 
        box-shadow: 0 0 35px rgba(249, 115, 22, 0.6), 0 0 60px rgba(249, 115, 22, 0.2);
        border-color: rgba(249, 115, 22, 0.8);
      }
    }
    
    .queue-item.em-atendimento {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.08));
      border: 2px solid rgba(59, 130, 246, 0.4);
    }
    
    .senha-badge {
      font-weight: 900;
      text-align: center;
      padding: 4px 8px;
      border-radius: 8px;
    }
    
    .na-fila .senha-badge { color: #fbbf24; }
    .chamado .senha-badge { color: #fb923c; }
    .em-atendimento .senha-badge { color: #60a5fa; }
    
    .client-info { flex: 1; min-width: 0; }
    
    .client-name {
      font-weight: 800;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .client-service {
      color: #94a3b8;
      margin-top: 3px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .client-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 3px;
    }

    .wait-time {
      color: #64748b;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .status-tag {
      font-weight: 800;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    
    .na-fila .status-tag { background: rgba(234, 179, 8, 0.2); color: #fbbf24; }
    .chamado .status-tag { background: rgba(249, 115, 22, 0.25); color: #fb923c; }
    .em-atendimento .status-tag { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    /* QR embaixo do grupo */
    .qr-shared {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 14px 20px;
      margin: 0 10px 10px;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.6), rgba(10, 22, 40, 0.8));
      border-radius: 14px;
      border: 2px solid rgba(212, 175, 55, 0.25);
    }

    .qr-shared img {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      background: white;
      padding: 8px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }

    .qr-shared-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .qr-shared-label {
      font-size: 1.8em;
      color: #D4AF37;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    .qr-shared-sublabel {
      font-size: 1.15em;
      color: #93c5fd;
      font-weight: 700;
    }

    .qr-shared-hint {
      font-size: 1em;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 4px;
    }

    .sem-preferencia {
      padding: 0 20px 6px;
      flex-shrink: 0;
    }
    
    .sem-pref-header {
      text-align: center;
      padding: 6px;
      font-size: 1.1em;
      font-weight: 800;
      color: #a78bfa;
      border-top: 2px solid rgba(167, 139, 250, 0.2);
      padding-top: 8px;
    }
    
    .sem-pref-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 6px;
    }
    
    .sem-pref-item {
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.12), rgba(167, 139, 250, 0.05));
      border: 2px solid rgba(167, 139, 250, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sem-pref-item .senha-badge { color: #a78bfa; font-size: 1.2em; }
    .sem-pref-item .client-name { font-size: 1.1em; }
    
    .empty-queue {
      text-align: center;
      padding: 30px;
      color: #475569;
      font-size: 1.3em;
      font-style: italic;
    }
    
    .footer {
      flex-shrink: 0;
      text-align: center;
      padding: 6px;
      background: rgba(10, 22, 40, 0.9);
      border-top: 2px solid rgba(212, 175, 55, 0.15);
      font-size: 1em;
      color: #64748b;
      height: 32px;
    }
    
    .total-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 2px;
    }
    
    .total-item { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .total-dot { width: 10px; height: 10px; border-radius: 50%; }
    .total-dot.amarelo { background: #fbbf24; }
    .total-dot.laranja { background: #fb923c; }
    .total-dot.azul { background: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>BARBEARIA DO PARAGUAI</h1>
    <div class="header-right">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </div>
  </div>
  
  <div class="main-container" id="mainContainer"></div>
  
  <div class="sem-preferencia" id="semPref"></div>
  
  <div class="footer">
    <div class="total-bar" id="totalBar"></div>
  </div>
  
  <script>
    var allData = { fila: [], barbeiros: [] };

    // Layout customizado: dois grupos
    // Esquerdo: Igor + Paraguai (sem QR)
    // Direito: Tobias + Riccky (com QR embaixo)
    var groupLeft = ["Tobias", "Riccky"];
    var groupRight = ["Igor", "Paraguai"];

    var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https://barbearia-paraguai2.github.io/fila/";

    var diasSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    var meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
      var dia = diasSemana[now.getDay()];
      var num = now.getDate();
      var mes = meses[now.getMonth()];
      document.getElementById('date').textContent = dia + ', ' + num + ' de ' + mes;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function scaleToFit() {
      var scaleX = window.innerWidth / 1920;
      var scaleY = window.innerHeight / 1080;
      var scale = Math.min(scaleX, scaleY);
      document.body.style.transform = 'scale(' + scale + ')';
      document.body.style.transformOrigin = 'top left';
    }
    window.addEventListener('resize', scaleToFit);
    scaleToFit();

    function getSizeClass(count) {
      if (count <= 3) return 'size-xl';
      if (count <= 5) return 'size-lg';
      if (count <= 8) return 'size-md';
      if (count <= 12) return 'size-sm';
      return 'size-xs';
    }

    function getWaitTime(entradaMs) {
      if (!entradaMs) return '';
      var now = Date.now();
      var diff = Math.floor((now - entradaMs) / 60000);
      if (diff < 1) return 'agora';
      if (diff < 60) return diff + 'min';
      var h = Math.floor(diff / 60);
      var m = diff % 60;
      return h + 'h' + (m > 0 ? m + 'min' : '');
    }
    
    var API_URL = "https://script.google.com/macros/s/AKfycbwHm7Y_NW-M8MRkQsBGx7wXquS283weR4cZs9QrV0b9H7VAyG8RWvXR1P4G7i2ptyMKJg/exec?p=api";

    function loadData() {
      fetch(API_URL)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          allData = data;
          renderAll();
        })
        .catch(function(err) {
          console.error("Erro ao carregar dados:", err);
        });
    }

    function renderBarberColumn(barb, filaData) {
      var bFila = filaData.filter(function(f) { return f.barbeiro === barb.nome; });
      var atendendo = bFila.filter(function(f) { return f.status === "Em atendimento"; });
      var naFilaCount = bFila.filter(function(f) { return f.status === "Na fila"; }).length;
      var chamadoCount = bFila.filter(function(f) { return f.status === "Chamado"; }).length;
      var statusText = atendendo.length > 0 ? 'Ocupado' : 'Livre';
      var statusClass = atendendo.length > 0 ? 'ocupado' : 'livre';
      
      var countText = naFilaCount + ' na fila';
      if (chamadoCount > 0) countText += ' | ' + chamadoCount + ' chamado';
      var cardSize = getSizeClass(bFila.length);

      var unitLabel = barb.unidade === "Unidade 1" ? "Bordignon" : "J. Pessoa";

      var html = '';
      html += '<div class="barber-column">';
      html += '  <div class="barber-header">';
      html += '    <div class="barber-header-left">';
      html += '      <div class="barber-name">' + barb.nome + '</div>';
      html += '      <div class="barber-unit-badge">' + unitLabel + '</div>';
      html += '      <div class="barber-count">' + countText + '</div>';
      html += '    </div>';
      html += '    <div class="barber-status ' + statusClass + '">' + statusText + '</div>';
      html += '  </div>';
      html += '  <div class="queue-list">';
      
      if (bFila.length === 0) {
        html += '<div class="empty-queue">Nenhum cliente</div>';
      } else {
        bFila.forEach(function(f) {
          var cssClass = f.status === "Na fila" ? "na-fila" : (f.status === "Chamado" ? "chamado" : "em-atendimento");
          var statusLabel = f.status === "Em atendimento" ? "Cortando" : f.status;
          var waitText = (f.status === "Na fila" || f.status === "Chamado") ? getWaitTime(f.entrada) : '';
          
          html += '<div class="queue-item ' + cssClass + ' ' + cardSize + '">';
          html += '  <div class="senha-badge">' + f.senha + '</div>';
          html += '  <div class="client-info">';
          html += '    <div class="client-name">' + f.cliente + '</div>';
          html += '    <div class="client-meta">';
          html += '      <span class="client-service">' + f.servico + '</span>';
          if (waitText) {
            html += '      <span class="wait-time">' + waitText + '</span>';
          }
          html += '    </div>';
          html += '  </div>';
          html += '  <div class="status-tag">' + statusLabel + '</div>';
          html += '</div>';
        });
      }
      
      html += '  </div>';
      html += '</div>';
      return html;
    }
    
    function renderAll() {
      var container = document.getElementById('mainContainer');
      var semPref = document.getElementById('semPref');
      var totalBar = document.getElementById('totalBar');

      // Todos os clientes com barbeiro
      var comBarbeiro = allData.fila.filter(function(f) {
        return f.barbeiro && f.barbeiro !== "" && f.barbeiro !== "Sem preferência" && f.barbeiro !== "Sem preferencia";
      });

      var semPrefList = allData.fila.filter(function(f) {
        return !f.barbeiro || f.barbeiro === "" || f.barbeiro === "Sem preferência" || f.barbeiro === "Sem preferencia";
      });

      // Encontrar barbeiros por nome
      function findBarber(nome) {
        for (var i = 0; i < allData.barbeiros.length; i++) {
          if (allData.barbeiros[i].nome === nome) return allData.barbeiros[i];
        }
        return { nome: nome, unidade: "" };
      }

      var html = '';

      // Grupo esquerdo: Tobias + Riccky (com QR)
      html += '<div class="group-section has-qr">';
      html += '  <div class="group-body">';
      groupLeft.forEach(function(nome) {
        html += renderBarberColumn(findBarber(nome), comBarbeiro);
      });
      html += '  </div>';
      html += '  <div class="qr-shared">';
      html += '    <img src="' + qrUrl + '" alt="QR Fila"/>';
      html += '    <div class="qr-shared-text">';
      html += '      <div class="qr-shared-label">Veja a Fila</div>';
      html += '      <div class="qr-shared-sublabel">Acompanhe pelo celular e entre na fila</div>';
      html += '      <div class="qr-shared-hint">Aponte a camera do celular</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';

      // Grupo direito: Igor + Paraguai (sem QR, coluna inteira)
      html += '<div class="group-section">';
      html += '  <div class="group-body">';
      groupRight.forEach(function(nome) {
        html += renderBarberColumn(findBarber(nome), comBarbeiro);
      });
      html += '  </div>';
      html += '</div>';
      
      container.innerHTML = html;
      
      // Sem preferencia
      if (semPrefList.length > 0) {
        var spHtml = '<div class="sem-pref-header">Sem preferencia — proximo livre atende</div>';
        spHtml += '<div class="sem-pref-list">';
        semPrefList.forEach(function(f) {
          spHtml += '<div class="sem-pref-item">';
          spHtml += '  <div class="senha-badge">' + f.senha + '</div>';
          spHtml += '  <div class="client-info">';
          spHtml += '    <div class="client-name">' + f.cliente + '</div>';
          spHtml += '    <div class="client-service">' + f.servico + '</div>';
          spHtml += '  </div>';
          spHtml += '</div>';
        });
        spHtml += '</div>';
        semPref.innerHTML = spHtml;
      } else {
        semPref.innerHTML = '';
      }
      
      var naFila = allData.fila.filter(function(f) { return f.status === "Na fila"; }).length;
      var chamados = allData.fila.filter(function(f) { return f.status === "Chamado"; }).length;
      var atend = allData.fila.filter(function(f) { return f.status === "Em atendimento"; }).length;
      
      totalBar.innerHTML = 
        '<div class="total-item"><div class="total-dot amarelo"></div> Na fila: ' + naFila + '</div>' +
        '<div class="total-item"><div class="total-dot laranja"></div> Chamados: ' + chamados + '</div>' +
        '<div class="total-item"><div class="total-dot azul"></div> Em atendimento: ' + atend + '</div>';
    }
    
    setInterval(function() {
      if (allData.fila.length > 0) renderAll();
    }, 60000);
    
    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
