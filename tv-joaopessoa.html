<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d2137 30%, #0f2a4a 60%, #0a1628 100%);
      color: #e8edf3;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      /* Fonte base escala com o tamanho da tela: tablet ~17px, TV ~26px */
      font-size: calc(0.8vw + 0.9vh);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    .header {
      padding: 0.5em 1.4em;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.95) 0%, rgba(10, 22, 40, 0.7) 100%);
      border-bottom: 0.15em solid rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 0.8em;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8em;
      min-width: 0;
    }

    .header h1 {
      font-size: 1.7em;
      font-weight: 900;
      background: linear-gradient(135deg, #D4AF37, #F5D060, #D4AF37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-unit-badge {
      font-size: 0.95em;
      font-weight: 800;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 2px solid rgba(139, 92, 246, 0.4);
      padding: 0.25em 0.8em;
      border-radius: 0.5em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.15;
    }

    .header .clock {
      font-size: 1.6em;
      color: #e2e8f0;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .header .date {
      font-size: 0.85em;
      color: #93c5fd;
      font-weight: 700;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .group-body {
      flex: 1;
      display: flex;
      padding: 0.5em;
      gap: 0.5em;
      overflow: hidden;
      min-height: 0;
    }

    /* Em tela de pé (retrato), um barbeiro em cima do outro */
    @media (orientation: portrait) {
      .group-body { flex-direction: column; }
    }

    .barber-column {
      flex: 1;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.6) 0%, rgba(10, 22, 40, 0.4) 100%);
      border-radius: 0.6em;
      border: 2px solid rgba(59, 130, 246, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .barber-header {
      padding: 0.45em 0.7em;
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.4), rgba(37, 99, 235, 0.2));
      border-bottom: 2px solid rgba(59, 130, 246, 0.3);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4em;
    }

    .barber-header-left {
      display: flex;
      align-items: center;
      gap: 0.5em;
      min-width: 0;
      flex-shrink: 1;
    }

    .barber-name {
      font-size: 1.6em;
      font-weight: 900;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .barber-count {
      font-size: 1em;
      color: #fbbf24;
      font-weight: 800;
      background: rgba(234, 179, 8, 0.15);
      padding: 0.15em 0.6em;
      border-radius: 0.5em;
      border: 1px solid rgba(234, 179, 8, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .barber-status {
      font-size: 1em;
      font-weight: 800;
      padding: 0.15em 0.7em;
      border-radius: 0.5em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .barber-status.livre {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 2px solid rgba(74, 222, 128, 0.3);
    }
    .barber-status.ocupado {
      color: #f97316;
      background: rgba(249, 115, 22, 0.12);
      border: 2px solid rgba(249, 115, 22, 0.3);
    }

    .queue-list {
      flex: 1;
      padding: 0.5em;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      min-height: 0;
    }

    .queue-list::-webkit-scrollbar { width: 6px; }
    .queue-list::-webkit-scrollbar-track { background: transparent; }
    .queue-list::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 4px; }

    .queue-item {
      border-radius: 0.5em;
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex-shrink: 0;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tamanhos por quantidade de clientes — bem maiores que a TV antiga */
    .queue-item.size-xl { padding: 0.7em 0.7em; }
    .queue-item.size-xl .senha-badge { font-size: 2.1em; min-width: 2.6em; }
    .queue-item.size-xl .client-name { font-size: 1.8em; }
    .queue-item.size-xl .client-service { font-size: 1.15em; }
    .queue-item.size-xl .status-tag { font-size: 1.05em; padding: 0.3em 0.6em; }
    .queue-item.size-xl .wait-time { font-size: 1.05em; }

    .queue-item.size-lg { padding: 0.55em 0.6em; }
    .queue-item.size-lg .senha-badge { font-size: 1.7em; min-width: 2.4em; }
    .queue-item.size-lg .client-name { font-size: 1.45em; }
    .queue-item.size-lg .client-service { font-size: 1em; }
    .queue-item.size-lg .status-tag { font-size: 0.9em; padding: 0.25em 0.55em; }
    .queue-item.size-lg .wait-time { font-size: 0.95em; }

    .queue-item.size-md { padding: 0.45em 0.55em; }
    .queue-item.size-md .senha-badge { font-size: 1.4em; min-width: 2.2em; }
    .queue-item.size-md .client-name { font-size: 1.2em; }
    .queue-item.size-md .client-service { font-size: 0.9em; }
    .queue-item.size-md .status-tag { font-size: 0.78em; padding: 0.2em 0.5em; }
    .queue-item.size-md .wait-time { font-size: 0.85em; }

    .queue-item.size-sm { padding: 0.35em 0.5em; }
    .queue-item.size-sm .senha-badge { font-size: 1.15em; min-width: 2em; }
    .queue-item.size-sm .client-name { font-size: 1em; }
    .queue-item.size-sm .client-service { font-size: 0.8em; }
    .queue-item.size-sm .status-tag { font-size: 0.68em; padding: 0.2em 0.45em; }
    .queue-item.size-sm .wait-time { font-size: 0.75em; }

    .queue-item.size-xs { padding: 0.3em 0.45em; gap: 0.4em; }
    .queue-item.size-xs .senha-badge { font-size: 1em; min-width: 1.9em; }
    .queue-item.size-xs .client-name { font-size: 0.9em; }
    .queue-item.size-xs .client-service { display: none; }
    .queue-item.size-xs .status-tag { font-size: 0.6em; padding: 0.15em 0.4em; }
    .queue-item.size-xs .wait-time { font-size: 0.68em; }

    .queue-item.na-fila {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(234, 179, 8, 0.05));
      border: 2px solid rgba(234, 179, 8, 0.3);
    }

    .queue-item.chamado {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.25), rgba(249, 115, 22, 0.1));
      border: 2px solid rgba(249, 115, 22, 0.5);
      animation: slideIn 0.4s ease-out, chamadoPulse 1.5s ease-in-out infinite;
    }

    @keyframes chamadoPulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
        border-color: rgba(249, 115, 22, 0.5);
      }
      50% {
        opacity: 0.9;
        box-shadow: 0 0 35px rgba(249, 115, 22, 0.6), 0 0 60px rgba(249, 115, 22, 0.2);
        border-color: rgba(249, 115, 22, 0.8);
      }
    }

    .queue-item.em-atendimento {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.08));
      border: 2px solid rgba(59, 130, 246, 0.4);
    }

    .senha-badge {
      font-weight: 900;
      text-align: center;
      padding: 0.15em 0.3em;
      border-radius: 0.35em;
    }

    .na-fila .senha-badge { color: #fbbf24; }
    .chamado .senha-badge { color: #fb923c; }
    .em-atendimento .senha-badge { color: #60a5fa; }

    .client-info { flex: 1; min-width: 0; }

    .client-name {
      font-weight: 800;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .client-service {
      color: #94a3b8;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .client-meta {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-top: 0.12em;
    }

    .wait-time {
      color: #64748b;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-tag {
      font-weight: 800;
      border-radius: 0.35em;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .na-fila .status-tag { background: rgba(234, 179, 8, 0.2); color: #fbbf24; }
    .chamado .status-tag { background: rgba(249, 115, 22, 0.25); color: #fb923c; }
    .em-atendimento .status-tag { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    /* Barra do QR no rodapé */
    .qr-shared {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1em;
      padding: 0.5em 1em;
      margin: 0 0.5em 0.5em;
      background: linear-gradient(180deg, rgba(15, 42, 74, 0.6), rgba(10, 22, 40, 0.8));
      border-radius: 0.6em;
      border: 2px solid rgba(212, 175, 55, 0.25);
    }

    .qr-shared img {
      width: 6.5em;
      height: 6.5em;
      border-radius: 0.4em;
      background: white;
      padding: 0.25em;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }

    .qr-shared-text {
      display: flex;
      flex-direction: column;
      gap: 0.15em;
    }

    .qr-shared-label {
      font-size: 1.5em;
      color: #D4AF37;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.15;
    }

    .qr-shared-sublabel {
      font-size: 1em;
      color: #93c5fd;
      font-weight: 700;
    }

    .qr-shared-hint {
      font-size: 0.85em;
      color: #94a3b8;
      font-weight: 600;
    }

    .sem-preferencia {
      padding: 0 1em 0.3em;
      flex-shrink: 0;
    }

    .sem-pref-header {
      text-align: center;
      padding: 0.3em;
      font-size: 1em;
      font-weight: 800;
      color: #a78bfa;
      border-top: 2px solid rgba(167, 139, 250, 0.2);
      padding-top: 0.4em;
    }

    .sem-pref-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      justify-content: center;
      margin-top: 0.3em;
    }

    .sem-pref-item {
      padding: 0.35em 0.7em;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.12), rgba(167, 139, 250, 0.05));
      border: 2px solid rgba(167, 139, 250, 0.25);
      border-radius: 0.5em;
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .sem-pref-item .senha-badge { color: #a78bfa; font-size: 1.2em; }
    .sem-pref-item .client-name { font-size: 1.1em; }

    .empty-queue {
      text-align: center;
      padding: 1.5em;
      color: #475569;
      font-size: 1.4em;
      font-style: italic;
    }

    .footer {
      flex-shrink: 0;
      text-align: center;
      padding: 0.3em;
      background: rgba(10, 22, 40, 0.9);
      border-top: 2px solid rgba(212, 175, 55, 0.15);
      font-size: 0.9em;
      color: #64748b;
    }

    .total-bar {
      display: flex;
      justify-content: center;
      gap: 2em;
      flex-wrap: wrap;
    }

    .total-item { display: flex; align-items: center; gap: 0.4em; font-weight: 700; white-space: nowrap; }
    .total-dot { width: 0.55em; height: 0.55em; border-radius: 50%; }
    .total-dot.amarelo { background: #fbbf24; }
    .total-dot.laranja { background: #fb923c; }
    .total-dot.azul { background: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>Barbearia do Paraguai</h1>
      <div class="header-unit-badge">João Pessoa</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </div>
  </div>

  <div class="main-container">
    <div class="group-body" id="groupBody"></div>
    <div class="qr-shared">
      <img id="qrImg" alt="QR Fila"/>
      <div class="qr-shared-text">
        <div class="qr-shared-label">Entre na Fila</div>
        <div class="qr-shared-sublabel">Acompanhe pelo celular e entre na fila</div>
        <div class="qr-shared-hint">Aponte a camera do celular</div>
      </div>
    </div>
  </div>

  <div class="sem-preferencia" id="semPref"></div>

  <div class="footer">
    <div class="total-bar" id="totalBar"></div>
  </div>

  <script>
    var allData = { fila: [], barbeiros: [] };

    // Painel exclusivo da Unidade 2 (Joao Pessoa)
    var UNIT = "Unidade 2";
    var BARBERS = ["Riccky", "Giovani"];

    document.getElementById('qrImg').src =
      "https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https://barbearia-paraguai2.github.io/fila/joaopessoa.html";

    var diasSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    var meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
      var dia = diasSemana[now.getDay()];
      var num = now.getDate();
      var mes = meses[now.getMonth()];
      document.getElementById('date').textContent = dia + ', ' + num + ' de ' + mes;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Tela cheia no primeiro toque (pro tablet)
    document.addEventListener('click', function() {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.mozRequestFullScreen || el.webkitRequestFullscreen;
      if (fn) fn.call(el);
    });

    function getSizeClass(count) {
      if (count <= 3) return 'size-xl';
      if (count <= 6) return 'size-lg';
      if (count <= 9) return 'size-md';
      if (count <= 13) return 'size-sm';
      return 'size-xs';
    }

    function getWaitTime(entradaMs) {
      if (!entradaMs) return '';
      var now = Date.now();
      var diff = Math.floor((now - entradaMs) / 60000);
      if (diff < 1) return 'agora';
      if (diff < 60) return diff + 'min';
      var h = Math.floor(diff / 60);
      var m = diff % 60;
      return h + 'h' + (m > 0 ? m + 'min' : '');
    }

    var API_URL = "https://script.google.com/macros/s/AKfycbwHm7Y_NW-M8MRkQsBGx7wXquS283weR4cZs9QrV0b9H7VAyG8RWvXR1P4G7i2ptyMKJg/exec?p=api";

    function loadData() {
      fetch(API_URL)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          allData = data;
          renderAll();
        })
        .catch(function(err) {
          console.error("Erro ao carregar dados:", err);
        });
    }

    function renderBarberColumn(barb, filaData) {
      var bFila = filaData.filter(function(f) { return f.barbeiro === barb.nome; });
      var atendendo = bFila.filter(function(f) { return f.status === "Em atendimento"; });
      var naFilaCount = bFila.filter(function(f) { return f.status === "Na fila"; }).length;
      var chamadoCount = bFila.filter(function(f) { return f.status === "Chamado"; }).length;
      var statusText = atendendo.length > 0 ? 'Ocupado' : 'Livre';
      var statusClass = atendendo.length > 0 ? 'ocupado' : 'livre';

      var countText = naFilaCount + ' na fila';
      if (chamadoCount > 0) countText += ' | ' + chamadoCount + ' chamado';
      var cardSize = getSizeClass(bFila.length);

      var html = '';
      html += '<div class="barber-column">';
      html += '  <div class="barber-header">';
      html += '    <div class="barber-header-left">';
      html += '      <div class="barber-name">' + barb.nome + '</div>';
      html += '      <div class="barber-count">' + countText + '</div>';
      html += '    </div>';
      html += '    <div class="barber-status ' + statusClass + '">' + statusText + '</div>';
      html += '  </div>';
      html += '  <div class="queue-list">';

      if (bFila.length === 0) {
        html += '<div class="empty-queue">Nenhum cliente</div>';
      } else {
        bFila.forEach(function(f) {
          var cssClass = f.status === "Na fila" ? "na-fila" : (f.status === "Chamado" ? "chamado" : "em-atendimento");
          var statusLabel = f.status === "Em atendimento" ? "Cortando" : f.status;
          var waitText = (f.status === "Na fila" || f.status === "Chamado") ? getWaitTime(f.entrada) : '';

          html += '<div class="queue-item ' + cssClass + ' ' + cardSize + '">';
          html += '  <div class="senha-badge">' + f.senha + '</div>';
          html += '  <div class="client-info">';
          html += '    <div class="client-name">' + f.cliente + '</div>';
          html += '    <div class="client-meta">';
          html += '      <span class="client-service">' + f.servico + '</span>';
          if (waitText) {
            html += '      <span class="wait-time">' + waitText + '</span>';
          }
          html += '    </div>';
          html += '  </div>';
          html += '  <div class="status-tag">' + statusLabel + '</div>';
          html += '</div>';
        });
      }

      html += '  </div>';
      html += '</div>';
      return html;
    }

    function renderAll() {
      var groupBody = document.getElementById('groupBody');
      var semPref = document.getElementById('semPref');
      var totalBar = document.getElementById('totalBar');

      // Somente clientes da Unidade 2
      var filaUnit = allData.fila.filter(function(f) { return f.unidade === UNIT; });

      var comBarbeiro = filaUnit.filter(function(f) {
        return f.barbeiro && f.barbeiro !== "" && f.barbeiro !== "Sem preferência" && f.barbeiro !== "Sem preferencia";
      });

      var semPrefList = filaUnit.filter(function(f) {
        return !f.barbeiro || f.barbeiro === "" || f.barbeiro === "Sem preferência" || f.barbeiro === "Sem preferencia";
      });

      function findBarber(nome) {
        for (var i = 0; i < allData.barbeiros.length; i++) {
          if (allData.barbeiros[i].nome === nome) return allData.barbeiros[i];
        }
        return { nome: nome, unidade: "" };
      }

      var html = '';
      BARBERS.forEach(function(nome) {
        html += renderBarberColumn(findBarber(nome), comBarbeiro);
      });
      groupBody.innerHTML = html;

      if (semPrefList.length > 0) {
        var spHtml = '<div class="sem-pref-header">Sem preferencia — proximo livre atende</div>';
        spHtml += '<div class="sem-pref-list">';
        semPrefList.forEach(function(f) {
          spHtml += '<div class="sem-pref-item">';
          spHtml += '  <div class="senha-badge">' + f.senha + '</div>';
          spHtml += '  <div class="client-info">';
          spHtml += '    <div class="client-name">' + f.cliente + '</div>';
          spHtml += '    <div class="client-service">' + f.servico + '</div>';
          spHtml += '  </div>';
          spHtml += '</div>';
        });
        spHtml += '</div>';
        semPref.innerHTML = spHtml;
      } else {
        semPref.innerHTML = '';
      }

      var naFila = filaUnit.filter(function(f) { return f.status === "Na fila"; }).length;
      var chamados = filaUnit.filter(function(f) { return f.status === "Chamado"; }).length;
      var atend = filaUnit.filter(function(f) { return f.status === "Em atendimento"; }).length;

      totalBar.innerHTML =
        '<div class="total-item"><div class="total-dot amarelo"></div> Na fila: ' + naFila + '</div>' +
        '<div class="total-item"><div class="total-dot laranja"></div> Chamados: ' + chamados + '</div>' +
        '<div class="total-item"><div class="total-dot azul"></div> Em atendimento: ' + atend + '</div>';
    }

    setInterval(function() {
      if (allData.fila.length > 0) renderAll();
    }, 60000);

    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
